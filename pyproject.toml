[project]
name = "imgx"
version = "0.1.0"
description = "Image processing API"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.127.0",
    "uvicorn>=0.41.0",
    "sqlalchemy>=2.0.45",
    "alembic>=1.17.2",
    "python-multipart>=0.0.21",
    "pillow>=12.0.0",
    "python-jose>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "email-validator>=2.3.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "psycopg[binary]>=3.3.3"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "httpx>=0.28.1"
]