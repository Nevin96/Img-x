services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
    depends_on:
      - db
    env_file:
      - .env
  db:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=imgx
      - POSTGRES_PASSWORD=imgx
      - POSTGRES_DB=imgx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: